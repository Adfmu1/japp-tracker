name: Release artifacts

on:
  workflow_run:
    workflows:
      - CI
      - Security gates
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write
  packages: write
  attestations: write

concurrency:
  # Each commit gets one candidate. A newer completion supersedes a pending
  # candidate for the same main branch instead of racing artifact publication.
  group: production-candidate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  COSIGN_CERTIFICATE_IDENTITY: ${{ vars.COSIGN_CERTIFICATE_IDENTITY }}

jobs:
  release:
    name: Build, sign, and attest release image
    if: >-
      (github.event.workflow_run.name == 'CI' ||
      github.event.workflow_run.name == 'Security gates') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Wait for both required gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          for workflow in ci.yml security-gates.yml; do
            conclusion=""
            for attempt in $(seq 1 60); do
              conclusion="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --commit "$RELEASE_SHA" \
                  --limit 1 \
                  --json status,conclusion \
                  --jq '.[] | select(.status == "completed") | .conclusion' \
                  | head -n 1
              )"
              if [ "$conclusion" = "success" ]; then
                break
              fi
              if [ "$conclusion" != "" ] && [ "$conclusion" != "success" ]; then
                echo "$workflow failed for $RELEASE_SHA: $conclusion" >&2
                exit 1
              fi
              sleep 10
            done
            if [ "$conclusion" != "success" ]; then
              echo "$workflow did not pass for $RELEASE_SHA" >&2
              exit 1
            fi
          done

      - name: Check out the gated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}

      - name: Log in to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push the release image once
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.event.workflow_run.head_sha }}

      - name: Record digest-qualified image identity
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          test -n "$DIGEST"
          case "$DIGEST" in sha256:*) ;; *) echo "Build did not return a sha256 digest" >&2; exit 1 ;; esac
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "commit=${RELEASE_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "image=${IMAGE}"
            echo "digest=${DIGEST}"
            echo "signer=${COSIGN_CERTIFICATE_IDENTITY}"
            echo "verification=CD must verify the signature and digest before deployment"
          } | tee image-digest.txt

      - name: Scan the exact release image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$HOME/.docker:/root/.docker:ro" \
            aquasec/trivy@sha256:029e990b328d149bf0a9ffe355919041e1f86192db2df47e217f8a36dd42ceac \
            image "$IMAGE" \
            --scanners vuln \
            --pkg-types os \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table

      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Sign image with keyless Cosign and GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      - name: Publish SLSA provenance to the registry
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish release metadata for CD
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: image-digest.txt
          if-no-files-found: error

      - name: Record production candidate evidence
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          test -n "$COSIGN_CERTIFICATE_IDENTITY"
          {
            echo "## Production candidate"
            echo "- status: \`awaiting_protected_production_approval\`"
            echo "- commit: \`$RELEASE_SHA\`"
            echo "- image digest: \`$IMAGE\`"
            echo "- signer: \`$COSIGN_CERTIFICATE_IDENTITY\`"
            echo "- deployment: \`not_started\`"
            echo "- superseded candidates: newer successful main candidates replace pending candidates"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "candidate_status=awaiting_protected_production_approval"
            echo "commit=$RELEASE_SHA"
            echo "image=$IMAGE"
            echo "signer=$COSIGN_CERTIFICATE_IDENTITY"
          } > candidate-evidence.txt

      - name: Publish candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-evidence
          path: candidate-evidence.txt
          if-no-files-found: error
