name: Security gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TRIVY_SEVERITY: MEDIUM,HIGH,CRITICAL

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements.txt --strict --desc on-failure

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and generated artifacts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source, configuration, and generated files
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact --exit-code 1 --no-banner

  filesystem-scan:
    name: Filesystem and IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan filesystem and infrastructure configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
          ignore-unfixed: true
          format: table

  container-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image for security scanning
        run: docker build --tag japp-security:${GITHUB_SHA} .

      - name: Scan built image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: japp-security:${{ github.sha }}
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
          ignore-unfixed: true
          format: table
