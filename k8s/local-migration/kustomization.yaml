apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: japp

resources:
  - ../migration-job.yaml

configMapGenerator:
  - name: rds-ca
    files:
      - ../rds/global-bundle.pem
    options:
      disableNameSuffixHash: true

images:
  - name: __IMAGE__
    newName: docker.io/adfmu/japp
    newTag: v1
