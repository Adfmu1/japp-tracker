apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: japp
  namespace: japp
spec:
  hostnames:
    - japp-tracker.duckdns.org
  parentRefs:
    - name: japp-gateway
      namespace: japp
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
      - name: japp-app
        port: 80
        kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: japp-http-redirect
  namespace: japp
spec:
  hostnames:
    - japp-tracker.duckdns.org
  parentRefs:
    - name: japp-gateway
      namespace: japp
      sectionName: web
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 308
