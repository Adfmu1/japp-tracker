name: Security gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TRIVY_SEVERITY: MEDIUM,HIGH,CRITICAL

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements.txt --strict --desc on

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and generated artifacts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source, configuration, and generated files
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --exit-code 1 --no-banner

  filesystem-scan:
    name: Filesystem and IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan infrastructure configuration
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            aquasec/trivy:0.59.1 \
            config /repo/infra/aws \
            --severity "${TRIVY_SEVERITY}" \
            --exit-code 1 \
            --format table

  container-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image for security scanning
        run: docker build --tag japp-security:${GITHUB_SHA} .

      - name: Scan built image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.59.1 \
            image japp-security:${GITHUB_SHA} \
            --scanners vuln \
            --pkg-types os \
            --severity "${TRIVY_SEVERITY}" \
            --exit-code 1 \
            --ignore-unfixed \
            --format table
