name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16
        image: postgres@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
        env:
          POSTGRES_DB: japp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d japp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable service-container credentials only; never production values.
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/japp
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/japp
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run pytest
        run: python -m pytest
