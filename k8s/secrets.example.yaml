# Copy this file to secrets.yaml and replace every placeholder.
# Never commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
type: Opaque
stringData:
  POSTGRES_DB: japp
  POSTGRES_USER: japp_admin
  POSTGRES_PASSWORD: replace-with-a-strong-random-password
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-long-random-application-secret
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: japp
  POSTGRES_USER: japp_admin
  DB_URL: postgresql+psycopg2://japp_admin:replace-with-a-strong-random-password@postgres:5432/japp?sslmode=disable
