apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: japp
  namespace: japp
spec:
  parentRefs:
    - name: japp-gateway
      namespace: japp
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: japp-app
          port: 80
          kind: Service
