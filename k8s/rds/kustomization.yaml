apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: japp

resources:
  - ../namespace.yaml
  - ../app.yaml
  - ../routing-local.yaml

configMapGenerator:
  - name: rds-ca
    files:
      - global-bundle.pem
    options:
      disableNameSuffixHash: true

images:
  - name: __IMAGE__
    newName: docker.io/adfmu/japp
    newTag: v1
