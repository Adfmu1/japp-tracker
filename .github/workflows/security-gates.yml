name: Security gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TRIVY_SEVERITY: MEDIUM,HIGH,CRITICAL

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements.txt --strict --desc on

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and generated artifacts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan source, configuration, and generated files
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source /repo --redact --exit-code 1 --no-banner

  filesystem-scan:
    name: Filesystem and IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan infrastructure configuration
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            aquasec/trivy@sha256:029e990b328d149bf0a9ffe355919041e1f86192db2df47e217f8a36dd42ceac \
            config /repo/infra/aws \
            --severity "${TRIVY_SEVERITY}" \
            --exit-code 1 \
            --format table
